<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light" />
    <link rel="icon" href="data:," />
    <title>Virtual Office Formación — en vivo</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;700;800;900&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore-compat.js"></script>
    <style>
      :root{
        color-scheme: light;
        --bg:#ffffff; --surface:#ffffff; --surface-2:#f4f4f5; --surface-3:#fafafa;
        --ink:#0a0a0a; --text:#0a0a0a; --dim:#71717a; --dim-2:#a1a1aa;
        --border:#e9e9ec; --border-strong:#d4d4d8;
        --accent:#e30613; --accent-ink:#b0050f; --accent-soft:#fff1f2;
        --radius:18px;
        --font-display:"Archivo",system-ui,sans-serif;
        --font-sans:"Inter",system-ui,sans-serif;
      }
      *{box-sizing:border-box}
      html,body{margin:0;padding:0}
      body{font-family:var(--font-sans);background:var(--bg);color:var(--text);-webkit-font-smoothing:antialiased}
      button,[role="button"],select,input,textarea{font-family:inherit}
      button,[role="button"],select,summary,input:not([type="checkbox"],[type="radio"]){min-height:2rem}
      button{cursor:pointer;border:none;background:none;color:inherit}
      .font-display{font-family:var(--font-display);letter-spacing:-.02em}
      .wrap{max-width:64rem;margin:0 auto;padding-left:1rem;padding-right:1rem}
      svg{display:inline-block;vertical-align:middle;flex-shrink:0}
      .hero-outer{padding:.75rem .75rem 0}
      @media(min-width:640px){.hero-outer{padding:.75rem 1rem 0}}
      .hero{position:relative;overflow:hidden;border-radius:28px;background:#0a0a0a;color:#fff;box-shadow:0 24px 48px -20px rgba(0,0,0,.45);max-width:64rem;margin:0 auto}
      .hero::before{content:"";position:absolute;inset:0 0 auto 0;height:6px;background:var(--accent)}
      .hero-glow{position:absolute;right:-4rem;top:-5rem;width:14rem;height:14rem;border-radius:50%;background:rgba(227,6,19,.25);filter:blur(48px);pointer-events:none}
      .hero-inner{position:relative;padding:1.5rem 1.25rem}
      @media(min-width:640px){.hero-inner{padding:1.5rem 1.75rem 1.75rem}}
      .hero-top{display:flex;align-items:center;justify-content:space-between;gap:.5rem;flex-wrap:wrap}
      .hero-badge{display:inline-flex;align-items:center;gap:.5rem;border-radius:999px;background:rgba(255,255,255,.1);padding:.375rem .75rem;font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.16em}
      .hero-badge .dot{width:.5rem;height:.5rem;border-radius:50%;background:var(--accent);box-shadow:0 0 0 4px rgba(227,6,19,.25)}
      .hero-nav{display:flex;align-items:center;gap:.375rem}
      .hero-nav button{display:flex;width:2.5rem;height:2.5rem;align-items:center;justify-content:center;border-radius:50%;background:rgba(255,255,255,.1);color:#fff;transition:background .15s}
      .hero-nav button:hover{background:var(--accent)}
      .hero-nav .hoy-btn{width:auto;height:auto;border-radius:999px;background:var(--accent);padding:.5rem .875rem;font-size:.875rem;font-weight:800;margin-left:.25rem}
      .hero h1{margin:1rem 0 0;max-width:36rem;font-family:var(--font-display);font-size:28px;font-weight:900;line-height:1.05;letter-spacing:-.02em}
      @media(min-width:640px){.hero h1{font-size:40px}}
      .hero-stats{margin-top:1.5rem;display:flex;align-items:center;gap:.75rem}
      @media(min-width:640px){.hero-stats{gap:1.25rem}}
      .ring{position:relative;width:72px;height:72px;flex-shrink:0}
      @media(min-width:640px){.ring{width:84px;height:84px}}
      .ring svg{width:100%;height:100%;transform:rotate(-90deg)}
      .ring .ring-label{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-family:var(--font-display);font-size:1.125rem;font-weight:900}
      @media(min-width:640px){.ring .ring-label{font-size:1.25rem}}
      .ring .ring-label small{font-size:.75rem}
      .stat-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:.375rem;flex:1;min-width:0}
      @media(min-width:640px){.stat-grid{gap:.5rem}}
      .stat{border-radius:1rem;background:rgba(255,255,255,.07);box-shadow:inset 0 0 0 1px rgba(255,255,255,.1);padding:.625rem}
      @media(min-width:640px){.stat{padding:.75rem}}
      .stat.red{background:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
      .stat .num{font-family:var(--font-display);font-size:1.25rem;font-weight:900;line-height:1}
      @media(min-width:640px){.stat .num{font-size:1.5rem}}
      .stat .lbl{margin-top:.375rem;display:flex;align-items:center;gap:.25rem;font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;line-height:1.2;color:rgba(255,255,255,.55)}
      .stat.red .lbl{color:rgba(255,255,255,.85)}
      @media(min-width:640px){.stat .lbl{font-size:10px}}
      .stat .lbl svg{display:none}
      @media(min-width:640px){.stat .lbl svg{display:inline-block}}
      @media(max-width:480px){
        .hero-stats{gap:.5rem}
        .stat{padding:.625rem .45rem}
        .stat .lbl{font-size:8px;letter-spacing:.01em;white-space:nowrap}
      }
      .livebar{margin-top:.75rem;display:flex;align-items:center;gap:.5rem;flex-wrap:wrap}
      .live-pill{display:inline-flex;align-items:center;gap:.45rem;border-radius:999px;padding:.4rem .75rem;font-size:12px;font-weight:800;background:#000;color:#fff}
      .live-pill .ldot{width:.55rem;height:.55rem;border-radius:50%;background:#22c55e;box-shadow:0 0 0 3px rgba(34,197,94,.25)}
      .live-pill.connecting .ldot{background:#f59e0b;box-shadow:0 0 0 3px rgba(245,158,11,.25)}
      .live-pill.error{background:var(--accent)}
      .live-pill.error .ldot{background:#fff;box-shadow:none}
      .live-note{font-size:12.5px;font-weight:600;color:var(--dim)}
      .phrase{position:relative;margin-top:.75rem;overflow:hidden;border-radius:var(--radius);border:1px solid var(--border);background:var(--accent-soft);padding:.875rem 1rem}
      @media(min-width:640px){.phrase{padding:.875rem 1.25rem}}
      .phrase::before{content:"";position:absolute;top:0;bottom:0;left:0;width:4px;background:var(--accent)}
      .phrase-row{display:flex;align-items:center;gap:.75rem;padding-left:.375rem}
      .phrase-ico{display:flex;width:2.5rem;height:2.5rem;flex-shrink:0;align-items:center;justify-content:center;border-radius:.75rem;background:var(--accent);color:#fff;box-shadow:0 1px 2px rgba(0,0,0,.1)}
      .phrase-body{flex:1;min-width:0}
      .phrase-kicker{font-size:10px;font-weight:900;text-transform:uppercase;letter-spacing:.16em;color:var(--accent-ink)}
      .phrase-text{margin-top:2px;font-family:var(--font-display);font-size:15px;font-weight:700;line-height:1.35;color:#000}
      @media(min-width:640px){.phrase-text{font-size:1rem}}
      .phrase-empty{margin-top:2px;font-size:.875rem;font-weight:600;line-height:1.4;color:var(--dim)}
      .phrase-meta{margin-top:.45rem;display:flex;align-items:center;gap:.45rem;flex-wrap:wrap;font-size:12px;font-weight:700;color:var(--dim)}
      .phrase-meta .pm-tag{display:inline-flex;align-items:center;gap:.3rem;border-radius:999px;background:#000;color:#fff;padding:3px .6rem;font-size:10px;font-weight:900;text-transform:uppercase;letter-spacing:.07em}
      .phrase-meta .pm-tag.pending{background:#fff;color:var(--accent-ink);box-shadow:inset 0 0 0 1px #fecdd3}
      .phrase-plan-note{border-radius:.75rem;background:var(--accent-soft);box-shadow:inset 0 0 0 1px #fecdd3;padding:.7rem .85rem;font-size:13px;font-weight:600;line-height:1.55;color:rgba(10,10,10,.85)}
      .phrase-plan-note strong{color:var(--accent-ink)}
      .phrase-plan-monthnav{display:flex;align-items:center;justify-content:space-between;gap:.5rem}
      .phrase-plan-monthnav h4{margin:0;font-family:var(--font-display);font-size:1rem;font-weight:900;text-transform:capitalize}
      .phrase-plan-monthnav .mn-btns{display:flex;gap:.375rem}
      .phrase-plan-monthnav .mn-btns button{display:flex;width:2.25rem;height:2.25rem;align-items:center;justify-content:center;border-radius:50%;background:#fff;box-shadow:inset 0 0 0 1px var(--border);color:#000}
      .phrase-plan-monthnav .mn-btns button:hover{background:#000;color:#fff}
      .phrase-field-head{display:flex;align-items:baseline;justify-content:space-between;gap:.5rem;flex-wrap:wrap;margin-bottom:.375rem}
      .phrase-field-head .pf-week{font-size:13px;font-weight:800;text-transform:uppercase;letter-spacing:.05em;color:#52525b}
      .phrase-field-head .pf-state{font-size:11px;font-weight:900;text-transform:uppercase;letter-spacing:.07em;color:var(--accent-ink)}
      .phrase-field-head .pf-state.ok{color:#000}
      .btn-black{display:inline-flex;flex-shrink:0;align-items:center;gap:.375rem;border-radius:999px;background:#000;color:#fff;padding:.5rem .875rem;font-size:13px;font-weight:800;transition:transform .15s}
      .btn-black:hover{transform:scale(1.03)}
      .tabs{margin-top:1rem;display:flex;gap:.25rem;border-radius:1rem;background:var(--surface-2);padding:.375rem}
      .tab{flex:1;display:flex;align-items:center;justify-content:center;gap:.375rem;border-radius:.75rem;padding:.625rem .5rem;font-size:13px;font-weight:800;color:#52525b;transition:all .15s;min-height:2.75rem}
      @media(min-width:640px){.tab{font-size:.875rem}}
      .tab:hover{color:#000}
      .tab.active{background:#000;color:#fff;box-shadow:0 8px 20px -8px rgba(0,0,0,.5)}
      .tab .count{border-radius:999px;padding:2px 6px;font-size:11px;font-weight:900;background:#fff;color:var(--dim);box-shadow:inset 0 0 0 1px var(--border)}
      .tab.active .count{background:var(--accent);color:#fff;box-shadow:none}
      .tab .tab-label{display:none}
      @media(min-width:420px){.tab .tab-label{display:inline}}
      main{padding-top:1.25rem;padding-bottom:7rem}
      .filterbar{margin-bottom:1.5rem;display:flex;flex-wrap:wrap;align-items:center;gap:.5rem}
      .filterbar .flabel{margin-right:.25rem;display:none;align-items:center;gap:.375rem;font-size:.75rem;font-weight:800;text-transform:uppercase;letter-spacing:.05em;color:var(--dim)}
      @media(min-width:640px){.filterbar .flabel{display:inline-flex}}
      .chip{border-radius:999px;padding:.5rem 1rem;font-size:.875rem;font-weight:800;transition:all .15s;background:#fff;color:#52525b;box-shadow:inset 0 0 0 1px var(--border);min-height:2.25rem}
      .chip:hover{box-shadow:inset 0 0 0 1px rgba(0,0,0,.3)}
      .chip.active{background:#000;color:#fff;box-shadow:0 1px 3px rgba(0,0,0,.2)}
      .chip-person{display:inline-flex;align-items:center;gap:.5rem;border-radius:999px;padding:.375rem .875rem .375rem .375rem;font-size:.875rem;font-weight:700;background:#fff;color:var(--text);box-shadow:inset 0 0 0 1px var(--border);transition:all .15s;min-height:2.25rem}
      .chip-person:hover{box-shadow:inset 0 0 0 1px rgba(0,0,0,.3)}
      .chip-person.active{background:var(--accent);color:#fff;box-shadow:0 8px 20px -8px rgba(227,6,19,.6)}
      .avatar{display:inline-flex;flex-shrink:0;align-items:center;justify-content:center;border-radius:50%;font-family:var(--font-display);font-weight:800;color:#fff;box-shadow:0 0 0 2px #fff,0 2px 8px rgba(0,0,0,.18)}
      .card{position:relative;overflow:hidden;border-radius:var(--radius);border:1px solid var(--border);background:#fff;padding:1rem;box-shadow:0 1px 3px rgba(0,0,0,.05),0 8px 24px -12px rgba(0,0,0,.12);transition:box-shadow .15s}
      .card:hover{box-shadow:0 2px 6px rgba(0,0,0,.06),0 16px 32px -12px rgba(0,0,0,.18)}
      .card.overdue{border-color:#fecdd3}
      .card .bar{position:absolute;top:0;bottom:0;left:0;width:4px}
      .card-top{display:flex;align-items:flex-start;gap:.75rem;padding-left:.375rem}
      .card-main{flex:1;min-width:0}
      .card-title-row{display:flex;align-items:flex-start;justify-content:space-between;gap:.5rem}
      .card h4{margin:0;font-family:var(--font-display);font-size:15px;font-weight:800;line-height:1.35;color:#000}
      .card h4.done{color:var(--dim);text-decoration:line-through;text-decoration-color:var(--accent);text-decoration-thickness:2px}
      .icon-btn{display:flex;width:2rem;height:2rem;flex-shrink:0;align-items:center;justify-content:center;border-radius:50%;color:#a1a1aa;transition:all .15s}
      .icon-btn:hover{background:#000;color:#fff}
      .card-who{margin-top:2px;display:flex;flex-wrap:wrap;align-items:center;gap:.375rem;font-size:13px;font-weight:600;color:var(--dim)}
      .card-who .who-name{color:rgba(0,0,0,.8);font-weight:600}
      .tags{margin-top:.625rem;display:flex;flex-wrap:wrap;gap:.375rem}
      .tag{display:inline-flex;align-items:center;gap:.375rem;border-radius:999px;padding:.25rem .625rem;font-size:.75rem;font-weight:700}
      .tag-place{background:var(--accent-soft);color:var(--accent-ink)}
      .tag-deliv{background:var(--surface-2);color:rgba(0,0,0,.75)}
      .tag-prio{font-weight:800;text-transform:uppercase;letter-spacing:.05em;gap:.25rem}
      .tag-prio.alta{background:var(--accent);color:#fff}
      .tag-prio.media{background:#000;color:#fff}
      .tag-prio.baja{background:#fff;color:var(--dim);box-shadow:inset 0 0 0 1px var(--border)}
      .status-group{margin:.875rem 0 0 .375rem;display:flex;border-radius:999px;background:var(--surface-2);padding:.25rem}
      .status-group button{flex:1;display:flex;align-items:center;justify-content:center;gap:.25rem;border-radius:999px;padding:.375rem .5rem;font-size:.75rem;font-weight:700;color:var(--dim);transition:all .15s;min-height:2rem}
      .status-group button.on-pendiente{background:#fff;color:#000;box-shadow:inset 0 0 0 1px rgba(0,0,0,.1),0 1px 3px rgba(0,0,0,.1)}
      .status-group button.on-curso{background:var(--accent);color:#fff;box-shadow:0 1px 3px rgba(0,0,0,.2)}
      .status-group button.on-completada{background:#000;color:#fff;box-shadow:0 1px 3px rgba(0,0,0,.2)}
      .overdue-box{margin-bottom:2rem;border-radius:var(--radius);background:var(--accent-soft);padding:1rem;box-shadow:inset 0 0 0 1px #fecdd3}
      .overdue-box h2{margin:0 0 .75rem;display:flex;align-items:center;gap:.625rem;font-family:var(--font-display);font-size:1rem;font-weight:800;color:var(--accent-ink)}
      .overdue-box h2 .ob-ico{display:flex;width:2rem;height:2rem;align-items:center;justify-content:center;border-radius:.5rem;background:var(--accent);color:#fff}
      .overdue-box h2 .ob-count{border-radius:999px;background:var(--accent);padding:2px .5rem;font-size:.75rem;font-weight:900;color:#fff}
      .grid-2{display:grid;gap:.75rem}
      @media(min-width:640px){.grid-2{grid-template-columns:1fr 1fr}}
      .grid-3{display:grid;gap:.75rem}
      @media(min-width:640px){.grid-3{grid-template-columns:1fr 1fr}}
      @media(min-width:1024px){.grid-3{grid-template-columns:1fr 1fr 1fr}}
      .day-section{margin-bottom:1.75rem}
      .day-head{margin-bottom:.75rem;display:flex;align-items:center;gap:.75rem}
      .day-pill{display:flex;width:2.75rem;height:2.75rem;flex-shrink:0;flex-direction:column;align-items:center;justify-content:center;border-radius:.75rem;font-family:var(--font-display);line-height:1;background:var(--surface-2);color:var(--dim)}
      .day-pill.has{background:#000;color:#fff}
      .day-pill.today{background:var(--accent);color:#fff;box-shadow:0 8px 20px -6px rgba(227,6,19,.6)}
      .day-pill.holiday{background:#fff;color:var(--accent-ink);box-shadow:inset 0 0 0 2px var(--accent)}
      .day-section.holiday .day-head h2{color:var(--accent-ink)}
      .day-pill .dnum{font-size:1rem;font-weight:900}
      .day-head h2{margin:0;display:flex;align-items:center;gap:.5rem;font-family:var(--font-display);font-size:1.125rem;font-weight:800;text-transform:capitalize;line-height:1.2}
      .today-badge{border-radius:999px;background:var(--accent);padding:2px .5rem;font-size:10px;font-weight:900;text-transform:uppercase;letter-spacing:.05em;color:#fff}
      .holiday-badge{border-radius:999px;background:#000;padding:3px .6rem;font-size:10px;font-weight:900;text-transform:uppercase;letter-spacing:.08em;color:#fff;box-shadow:inset 0 0 0 1px #000;white-space:nowrap}
      .holiday-badge::before{content:"";display:inline-block;width:.45rem;height:.45rem;border-radius:50%;background:var(--accent);margin-right:.35rem;vertical-align:1px}
      .holiday-banner{margin:-.25rem 0 .85rem;display:flex;align-items:flex-start;gap:.6rem;border-radius:12px;background:var(--accent-soft);box-shadow:inset 0 0 0 1px #fecdd3;padding:.7rem .85rem}
      .holiday-banner strong{font-family:var(--font-display);font-size:13px;font-weight:900;letter-spacing:.06em;text-transform:uppercase;color:var(--accent-ink);white-space:nowrap}
      .holiday-banner span{font-size:13px;font-weight:600;line-height:1.45;color:rgba(10,10,10,.8)}
      .rest-badge{display:inline-flex;align-items:center;gap:.3rem;border-radius:999px;background:var(--surface-2);padding:3px .6rem;font-size:10px;font-weight:900;text-transform:uppercase;letter-spacing:.08em;color:#000;white-space:nowrap}
      .rest-badge svg{color:var(--accent)}
      .rest-banner{margin:-.25rem 0 .85rem;display:flex;align-items:center;gap:.75rem;border-radius:12px;background:#0a0a0a;padding:.8rem .9rem}
      .rest-banner .rb-ico{display:flex;width:2.25rem;height:2.25rem;flex-shrink:0;align-items:center;justify-content:center;border-radius:.65rem;background:var(--accent);color:#fff}
      .rest-banner strong{display:block;font-family:var(--font-display);font-size:14px;font-weight:900;color:#fff}
      .rest-banner span{display:block;font-size:13px;font-weight:600;line-height:1.45;color:rgba(255,255,255,.75)}
      .dp-card.rest{background:var(--surface-3)}
      .dp-card.rest .dp-count{color:var(--accent-ink);font-weight:800}
      .day-sub{font-size:13px;font-weight:600;color:var(--dim)}
      .day-line{margin-left:auto;height:1px;flex:1;background:var(--border);display:none}
      @media(min-width:640px){.day-line{display:block}}
      .day-add{margin-left:auto;display:inline-flex;align-items:center;gap:.3rem;border-radius:999px;background:#000;color:#fff;padding:.45rem .8rem;font-size:12.5px;font-weight:800;flex-shrink:0}
      .daily-progress{margin-bottom:1.75rem}
      .daily-progress-head{margin-bottom:.75rem;display:flex;align-items:center;gap:.75rem;flex-wrap:wrap}
      .daily-progress-head h2{margin:0;display:flex;align-items:center;gap:.625rem;font-family:var(--font-display);font-size:1.125rem;font-weight:800}
      .daily-progress-head p{margin:0;font-size:13px;font-weight:600;color:var(--dim)}
      .dp-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:.5rem}
      @media(min-width:640px){.dp-grid{grid-template-columns:repeat(4,1fr)}}
      @media(min-width:1024px){.dp-grid{grid-template-columns:repeat(7,1fr)}}
      .dp-card{border-radius:14px;border:1px solid var(--border);background:#fff;padding:.75rem;box-shadow:0 1px 3px rgba(0,0,0,.05)}
      .dp-card.today{border-color:var(--accent);box-shadow:inset 0 0 0 1px rgba(227,6,19,.25),0 1px 3px rgba(0,0,0,.05)}
      .dp-card.holiday{border-color:var(--accent);background:var(--accent-soft);box-shadow:inset 0 0 0 1px rgba(227,6,19,.35)}
      .dp-card.holiday .dp-day{color:var(--accent-ink)}
      .dp-holiday-tag{display:inline-flex;margin-top:.45rem;border-radius:999px;background:#000;color:#fff;padding:2px .5rem;font-size:9px;font-weight:900;letter-spacing:.08em;text-transform:uppercase}
      .dp-card.full{border-color:#000}
      .dp-day{font-size:10px;font-weight:900;text-transform:uppercase;letter-spacing:.08em;color:var(--dim)}
      .dp-card.today .dp-day{color:var(--accent-ink)}
      .dp-date{margin-top:2px;font-family:var(--font-display);font-size:.95rem;font-weight:800;line-height:1.2;text-transform:capitalize}
      .dp-pct{margin-top:.625rem;font-family:var(--font-display);font-size:1.5rem;font-weight:900;line-height:1}
      .dp-pct span{font-size:.9rem;color:var(--dim)}
      .dp-count{margin-top:.25rem;font-size:12px;font-weight:700;color:var(--dim)}
      .dp-bar{margin-top:.5rem;height:.5rem;overflow:hidden;border-radius:999px;background:var(--surface-2)}
      .dp-bar>div{height:100%;border-radius:999px;background:var(--accent);transition:width .3s}
      .dp-bar>div.full{background:#000}
      .dp-bar>div.empty{background:transparent}
      .day-progress-inline{margin-top:.4rem;display:flex;align-items:center;gap:.5rem;flex-wrap:wrap}
      .day-progress-inline .dp-bar{margin-top:0;width:6.5rem;flex-shrink:0}
      .day-progress-inline .dp-inline-txt{font-size:12.5px;font-weight:800;color:#000}
      .day-progress-inline .dp-inline-txt.muted{font-weight:600;color:var(--dim)}

      function mondaysInMonth(year, monthIdx){

          db.collection("config").doc("frase").onSnapshot(function(docSnap){

      function buildPhraseMapWith(updates){
        var map = {};
        var current = state.phrasesByWeek || {};
        for (var k in FIXED_MONTH_PHRASES) map[k] = FIXED_MONTH_PHRASES[k];
        for (var k2 in current) { if (current[k2] != null && String(current[k2]).trim()) map[k2] = String(current[k2]); }
        for (var k3 in updates) {
          var val = updates[k3] == null ? "" : String(updates[k3]).trim();
          if (val) map[k3] = val; else delete map[k3];
        }
        return map;
      }
      function fsSavePhrasesByWeek(updates){
        if (!guardEdit()) return Promise.reject(new Error("locked"));
        if (!requireDb()) return Promise.reject(new Error("no-db"));
        var map = buildPhraseMapWith(updates);
        /* texto se mantiene sincronizado con la frase de la semana en curso
           para que cualquier vista antigua siga mostrando algo correcto. */
        var currentMonday = mondayOfISO(TODAY);
        var payload = { porSemana: map, texto: map[currentMonday] || "", actualizado: new Date().toISOString() };
        return db.collection("config").doc("frase").set(payload, { merge:true }).then(function(){
          state.phrasesByWeek = map;
          state.phraseLegacy = payload.texto;
          state.phrase = payload.texto;
        });
      }

      /* ----- Detalle de visitas / recorridos: un local debajo del otro -----
         Igual que en el tema de Próximas aperturas: el detalle puede venir
         todo junto (locales separados por comas), con un local por línea o
         con punto y coma; en todos los casos se muestra como lista vertical
         con el número de local destacado, la cabecera (Distrito / Zona) arriba
         y las notas de apoyo (p. ej. Speech en caja) debajo de la lista. */
      function parseLocalesDetail(detail){
        var raw = String(detail == null ? "" : detail).trim();
        if (!raw) return null;
        var re = /\b\d{3,4}\b/g, matches = [], mm;
        while ((mm = re.exec(raw)) !== null) matches.push({ code: mm[0], index: mm.index });
        if (matches.length < 2) return null;
        var introRaw = raw.slice(0, matches[0].index).trim();
        var intro = introRaw.replace(/^[-•·\s]+/, "").replace(/locales?\s*[:\-–—]?\s*$/i, "").replace(/[:\-–—\s]+$/, "").trim();
        if (/^locales?$/i.test(intro)) intro = "";
        var locales = [], footer = "";
        for (var i = 0; i < matches.length; i++){
          var start = matches[i].index;
          var end = (i + 1 < matches.length) ? matches[i + 1].index : raw.length;
          var seg = raw.slice(start, end).trim();
          var isLast = i === matches.length - 1;
          var footerPart = "";
          if (isLast){
            var nlIdx = seg.indexOf("\n");
            if (nlIdx !== -1){ footerPart = seg.slice(nlIdx + 1).trim(); seg = seg.slice(0, nlIdx).trim(); }
            var parenEnd = seg.lastIndexOf(")");
            if (parenEnd !== -1){
              var afterParen = seg.slice(parenEnd + 1).trim();
              if (afterParen){
                var cleanedAfter = afterParen.replace(/^\.\s*/, "").trim();
                if (cleanedAfter) footerPart = cleanedAfter + (footerPart ? " " + footerPart : "");
                seg = seg.slice(0, parenEnd + 1).trim();
              }
            } else if (!footerPart){
              var dotIdx = -1, searchFrom = 0;
              while (true){
                var idx = seg.indexOf(". ", searchFrom);
                if (idx === -1) break;
                var after = seg.slice(idx + 2).trim();
                if (after && /^[A-ZÁÉÍÓÚÑ]/.test(after) && after.split(/\s+/).length >= 3){ dotIdx = idx; break; }
                searchFrom = idx + 2;
              }
              if (dotIdx !== -1){ footerPart = seg.slice(dotIdx + 2).trim(); seg = seg.slice(0, dotIdx).trim(); }
              else if (seg.charAt(seg.length - 1) === ".") seg = seg.slice(0, -1).trim();
            }
            if (footerPart) footer = footerPart.replace(/^\.\s*/, "").trim();
          }
          seg = seg.replace(/[,;\s]+$/, "").trim();
          var afterCode = seg.slice(matches[i].code.length).trim().replace(/^[\-–—:\.]\s*/, "").trim();
          var note = null, name = afterCode;
          var anyParen = afterCode.match(/\(([^)]*)\)/);
          if (anyParen){
            note = anyParen[1].trim();
            name = (afterCode.slice(0, anyParen.index) + " " + afterCode.slice(anyParen.index + anyParen[0].length)).replace(/\s{2,}/g, " ").trim();
          }
          name = name.replace(/[,;]+$/, "").trim();
          locales.push({ code: matches[i].code, name: name, note: note, raw: seg });
        }
        var valid = locales.filter(function(l){ return l.name && l.name.length >= 2; });
        if (valid.length < 2) return null;
        return { intro: intro, locales: locales, footer: footer };
      }
      function localesListHTML(parsed, label){
        var out = "";
        if (parsed.intro) out += '<p class="visit-intro">' + esc(parsed.intro) + "</p>";
        out += '<div class="locales-list" role="list" aria-label="' + esc(label || "Locales, uno debajo del otro") + '">';
        parsed.locales.forEach(function(loc){
          out += '<div class="apertura-item" role="listitem">';
          out += '<span class="apertura-code"><small>Local</small><strong>' + esc(loc.code) + "</strong></span>";
          out += '<div class="apertura-main">';
          if (loc.name) out += '<p class="apertura-name">' + esc(loc.name) + "</p>";
          else out += '<p class="apertura-text">' + esc(loc.raw) + "</p>";
          if (loc.note) out += '<p class="apertura-fecha">' + icon("calendar", 13) + "<span>" + esc(loc.note) + "</span></p>";
          out += "</div></div>";
        });
        out += "</div>";
        if (parsed.footer) out += '<p class="visit-note">' + esc(parsed.footer) + "</p>";
        return out;
      }

    </script>
    <script>

      /* ---------- view: Semana ---------- */

        if (ov.length > 0) {
          h += '<section class="overdue-box" aria-label="Actividades vencidas"><h2><span class="ob-ico">'+icon("alert",16)+'</span>Vencidas sin completar<span class="ob-count">'+ov.length+'</span></h2><div class="grid-2">';
          ov.forEach(function(a){ h += activityCardHTML(a, true); });
          h += "</div></section>";
        }
        if (visible.length === 0 && ov.length === 0) {
          h += '<div class="empty"><span class="empty-ico">'+icon("calendar",30,1.9)+'</span><p class="t">Esta semana todavía no tiene actividades</p><p class="d">Pulsa «Nueva actividad» para agregar la primera: se guardará en Firestore y todo el equipo la verá al instante.</p></div>';
        } else {
          DAYS.forEach(function(dayName, i){
            var dateISO = addDaysISO(mo, i);
            var dayActs = visible.filter(function(a){return a.date===dateISO;});
            var isToday = dateISO === TODAY;
            var hol = holidayOf(dateISO);
            var pillCls = isToday ? "today" : hol ? "holiday" : dayActs.length > 0 ? "has" : "";
            var dayDone = dayActs.filter(function(a){return a.status==="completada";}).length;
            var dayPct = dayActs.length ? Math.round(dayDone/dayActs.length*100) : 0;
            var isRest = dayActs.length===0;
            var dayProg = dayActs.length
              ? '<div class="day-progress-inline"><span class="dp-bar"><div class="'+(dayPct===100?"full":"")+'" style="width:'+dayPct+'%"></div></span><span class="dp-inline-txt">Avance del día: '+dayPct+'% · '+dayDone+'/'+dayActs.length+' hechas</span></div>'

      /* ---------- view: Objetivos ---------- */

      /* ---------- view: Temas ---------- */
      function splitTopicLines(detail){
        var raw = String(detail == null ? "" : detail).trim();
        if (!raw) return [];
        var lines = raw.split(/\r?\n+/).map(function(s){ return s.trim(); }).filter(Boolean);
        if (lines.length > 1) return lines;
        var single = lines[0] || raw;
        var bySemi = single.split(/\s*;\s*/).map(function(s){ return s.trim(); }).filter(Boolean);
        if (bySemi.length > 1) return bySemi;
        var marked = single.replace(/\s+(?=(?:local(?:es)?\s+)?\d{3,4}\s*[\-–—:])/gi, "\n");
        var byLocal = marked.split(/\r?\n+/).map(function(s){ return s.trim(); }).filter(Boolean);
        if (byLocal.length > 1) return byLocal;
        var marked2 = single.replace(/\.\s+(?=(?:local(?:es)?\s+)?\d{3,4}\b)/gi, ".\n");
        var byLocal2 = marked2.split(/\r?\n+/).map(function(s){ return s.trim(); }).filter(Boolean);
        if (byLocal2.length > 1) return byLocal2;
        var marked3 = single.replace(/\s+(?=(?:local(?:es)?\s+)\d{3,4}\b)/gi, "\n");
        var byLocal3 = marked3.split(/\r?\n+/).map(function(s){ return s.trim(); }).filter(Boolean);
        if (byLocal3.length > 1) return byLocal3;
        return lines;
      }
      function parseAperturaLine(line){
        var codeMatch = line.match(/(?:local(?:es)?\s*)?(\d{3,4})\b/i);
        var code = codeMatch ? codeMatch[1] : null;
        var rest = line;
        if (codeMatch) {
          rest = line.replace(/(?:local(?:es)?\s*)?\d{3,4}\b\s*[:\-–—\.]?\s*/i, "").trim();
          rest = rest.replace(/^[\-\–—:\|·•\s]+/, "").trim();
        }
        /* La fecha de apertura se toma SOLO de lo que sigue a la etiqueta
           «Fecha de apertura:». Nunca se interpreta como fecha ninguna otra
           parte del nombre del local: p. ej. en «Cuenca y 6 de Marzo» el
           «6 de Marzo» es parte del nombre del local 855, no su fecha
           (su fecha es la que diga la etiqueta: 4 dic). Sin etiqueta, el
           local se muestra sin fecha y con el nombre completo. */
        var labelMatch = rest.match(/fecha\s+de\s+apertura\s*:\s*(.+)$/i);
        if (labelMatch) {
          var fecha = labelMatch[1].trim().replace(/[\s·•,;.]+$/, "").trim();
          var name = rest.slice(0, labelMatch.index).replace(/[\s·•\-–—:;,]+$/, "").trim();
          return { code: code, name: name, fecha: fecha || null, raw: line };
        }
        return { code: code, name: rest, fecha: null, raw: line };
      }
      function isAperturasTopic(t, lines){
        if (/apertura/i.test(String(t.title || ""))) return true;
        if (lines.length >= 2) {
          var withCode = lines.filter(function(l){ return /\d{3,4}/.test(l); }).length;
          var withApertura = lines.filter(function(l){ return /apertura/i.test(l); }).length;
          if (withCode >= 2 && withApertura >= 1) return true;
        }
        return false;
      }
      function renderTopicDetail(t){
        if (!t.detail) return "";
        /* Visitas / recorridos en temas: mismo formato que en actividades,
           un local debajo del otro, aunque el detalle venga todo junto. */
        if (!/apertura/i.test(String(t.title || "")) && (isVisitDetail(t) || /\blocales?\b/i.test(String(t.detail || "")))){
          var parsedTopic = parseLocalesDetail(String(t.detail).trim());
          if (parsedTopic) return '<div class="act-detail">' + localesListHTML(parsedTopic, "Locales, uno debajo del otro") + "</div>";
        }
        var lines = splitTopicLines(t.detail);
        if (lines.length <= 1) return '<p class="topic-detail">' + esc(t.detail) + "</p>";
        if (isAperturasTopic(t, lines)) {
          var intro = [], items = [], seen = false;
          lines.forEach(function(l){
            if (/\d{3,4}/.test(l)) { items.push(l); seen = true; }
            else if (!seen) intro.push(l);
            else items.push(l);
          });
          if (items.length === 0) items = lines.slice(), intro = [];
          var out = "";
          intro.forEach(function(l){ out += '<p class="aperturas-intro">' + esc(l) + "</p>"; });
          out += '<div class="aperturas-list" role="list" aria-label="Locales por aperturar, uno debajo del otro">';
          items.forEach(function(l, idx){
            var p = parseAperturaLine(l);
            /* Un local por línea: «Local NNN — nombre · Fecha de apertura: fecha»,
               con la fecha en rojo. La fecha sale solo de la etiqueta
               «Fecha de apertura:» (ver parseAperturaLine). */
            out += '<div class="apertura-item apertura-item--line" role="listitem">';
            out += '<p class="apertura-line">';
            if (p.code) out += '<span class="apertura-loc">Local ' + esc(p.code) + "</span> — ";
            var lineName = p.name || (!p.fecha ? p.raw : "");
            out += esc(lineName);
            if (p.fecha) out += ' · <span class="apertura-fecha-txt">Fecha de apertura: ' + esc(p.fecha) + "</span>";
            out += "</p></div>";
          });
          out += "</div>";
          return out;
        }
        var g = '<div class="topic-lines">';
        lines.forEach(function(l){ g += '<div class="topic-line">' + esc(l) + "</div>"; });
        g += "</div>";
        return g;
      }
      function renderTemas(main){
        var h = '<section aria-label="Temas importantes"><div class="sec-head"><h2>' + secBadge("bell", true) + 'Temas importantes</h2><button type="button" class="btn-red" id="topicNew">' + icon("plus",15,2.5) + ' Nuevo tema</button></div>';
        if (state.topics.length === 0) {
          h += emptyHTML("bell", "No hay temas importantes por ahora", "Pulsa «Nuevo tema» para agregar acuerdos, avisos y pendientes clave. Se verán en vivo para todo el equipo.", false);
        } else {
          var sorted = state.topics.slice().sort(function(a,b){ return (b.pinned?1:0)-(a.pinned?1:0); });
          h += '<div class="grid-2">';
          sorted.forEach(function(t){
            var lines = t.detail ? splitTopicLines(t.detail) : [];
            var wide = (isAperturasTopic(t, lines) && lines.length > 1) || !!(t.detail && parseLocalesDetail(String(t.detail).trim()));
            h += '<article class="card topic-card'+(t.pinned?" pinned":"")+(wide?" topic-card--wide":"")+'"><div style="display:flex;align-items:flex-start;justify-content:space-between;gap:.5rem"><h3>'+esc(t.title)+'</h3><span class="topic-actions"><button type="button" class="'+(t.pinned?"pin-on":"")+'" data-topic-pin="'+esc(t.id)+'" aria-label="'+(t.pinned?"Desfijar tema":"Fijar tema")+'" aria-pressed="'+t.pinned+'">'+icon("bookmark",15)+'</button><button type="button" data-topic-edit="'+esc(t.id)+'" aria-label="Editar tema">'+icon("pencil",15)+'</button></span></div>';
            if (t.detail) h += renderTopicDetail(t);
            if (t.pinned) h += '<span class="pinned-tag">'+icon("bookmark",11)+"Fijado</span>";
            h += "</article>";
          });
          h += "</div>";
        }
        h += "</section>";
        main.innerHTML = h;
        $("topicNew").addEventListener("click", function(){ openTopicModal(null); });
        var pb = main.querySelectorAll("[data-topic-pin]"); for (var i=0;i<pb.length;i++) pb[i].addEventListener("click", function(){ var t=topicById(this.getAttribute("data-topic-pin")); if(t) fsTogglePin(t.id, !t.pinned); });
        var eb2 = main.querySelectorAll("[data-topic-edit]"); for (var j=0;j<eb2.length;j++) eb2[j].addEventListener("click", function(){ var t=topicById(this.getAttribute("data-topic-edit")); if(t) openTopicModal(t); });
      }

      /* ---------- view: Equipo ---------- */
      function renderEquipo(main){
        var mo = monday();
        var wa = weekActs();
        var h = '<section aria-label="Equipo"><div class="sec-head" style="margin-bottom:.5rem"><h2>'+secBadge("users")+"Equipo de Formación</h2></div>";
        h += '<p class="team-sub">'+icon("trending",15)+"Carga de trabajo en la "+weekLabel(mo).toLowerCase()+".</p>";
        h += '<div class="grid-3">';
        state.members.forEach(function(m){
          var mine = wa.filter(function(a){return a.member_id===m.orden;});
          var mineDone = mine.filter(function(a){return a.status==="completada";}).length;
          var pct = mine.length ? Math.round(mineDone/mine.length*100) : 0;
          h += '<article class="card team-card" style="--team-color:'+m.color+'"><div class="team-top"><div class="team-who">'+avatar(m,52)+"<div><h3>"+esc(m.name)+"</h3><p>"+esc(m.role || "Equipo de Formación")+'</p></div></div></div><div class="team-pct"><span class="big">'+pct+'<span>%</span></span><span class="team-count">'+mineDone+"/"+mine.length+' hechas</span></div><div class="team-bar"><div style="width:'+pct+'%"></div></div><p class="team-note">'+(mine.length===0 ? "Sin actividades esta semana" : mine.length+(mine.length===1?" actividad":" actividades")+" esta semana")+"</p></article>";
        });
        h += "</div></section>";
        main.innerHTML = h;
      }
    </script>
    <script>
      "use strict";
      /* ================= MODALES / FORMULARIOS ================= */
      function closeModal(){ $("modalRoot").innerHTML = ""; }
      function openModal(title, bodyHTML){
        var root = $("modalRoot");
        root.innerHTML = '<div class="modal-backdrop"><button type="button" class="modal-bg" id="modalBg" aria-label="Cerrar"></button><div class="modal" role="dialog" aria-modal="true" aria-label="' + esc(title) + '"><div class="modal-head"><h3>' + esc(title) + '</h3><button type="button" class="modal-close" id="modalClose" aria-label="Cerrar">' + icon("x",16) + '</button></div>' + bodyHTML + '</div></div>';
        $("modalBg").addEventListener("click", closeModal);
        $("modalClose").addEventListener("click", closeModal);
      }
      function formError(msg){
        var e = $("formError");
        if (e) { e.textContent = msg; e.classList.add("show"); }
      }
      function deleteBlockHTML(){
        return '<div style="margin-top:1rem"><button type="button" class="btn-delete" id="delBtn">' + "Eliminar" + '</button><div class="confirm-row hidden" id="delConfirm"><button type="button" class="yes" id="delYes">Sí, eliminar</button><button type="button" class="no" id="delNo">Cancelar</button></div></div>';
      }
      function bindDelete(onDelete){
        var b = $("delBtn"), c = $("delConfirm");
        if (!b) return;
        b.addEventListener("click", function(){ b.classList.add("hidden"); c.classList.remove("hidden"); });
        $("delNo").addEventListener("click", function(){ c.classList.add("hidden"); b.classList.remove("hidden"); });
        $("delYes").addEventListener("click", onDelete);
      }
      function memberOptions(selected){
        var h = '<option value="">Sin asignar</option>';
        state.members.forEach(function(m){
          h += '<option value="' + m.orden + '"' + (selected === m.orden ? " selected" : "") + '>' + esc(m.name) + '</option>';
        });
        return h;
      }
      function statusOptions(selected){
        return ["pendiente","en_curso","completada"].map(function(s){
          return '<option value="' + s + '"' + (selected === s ? " selected" : "") + '>' + STATUS_LABEL[s] + '</option>';
        }).join("");
      }
      function priorityOptions(selected){
        var sel = normPriority(selected);
        if (!hasPriority(sel)) sel = "ninguna";
        return ["ninguna","alta","media","baja"].map(function(s){
          return '<option value="' + s + '"' + (sel === s ? " selected" : "") + '>' + PRIORITY_LABEL[s] + '</option>';
        }).join("");
      }

      function openCreateKeyModal(){
        var body = '<form class="form" id="lockForm">'
          + '<p class="form-note">Todavía no hay una clave de edición. Crea la tuya: desde ahora, solo quien la escriba podrá editar el tablero. Todos los demás seguirán viendo todo en vivo, en solo lectura.</p>'
          + '<div><label class="flabel" for="k1">Crea tu clave</label><input class="input" id="k1" type="password" autocomplete="new-password" placeholder="Escribe tu clave"></div>'
          + '<div><label class="flabel" for="k2">Confírmala</label><input class="input" id="k2" type="password" autocomplete="new-password" placeholder="Escríbela otra vez"></div>'
          + '<p class="form-note">Guárdala bien: la necesitarás para editar desde cualquier navegador.</p>'
          + '<div class="form-error" id="formError"></div>'
          + '<div class="form-actions"><button type="submit" class="btn-save" id="saveBtn">Crear clave y empezar a editar</button></div></form>';
        openModal("Crear clave de edición", body);
        $("lockForm").addEventListener("submit", function(ev){
          ev.preventDefault();
          var k1 = $("k1").value, k2 = $("k2").value;
          if (!k1 || k1.length < 4) { formError("Usa una clave de al menos 4 caracteres."); return; }
          if (k1 !== k2) { formError("Las claves no coinciden. Escríbelas igual en los dos campos."); return; }
          if (!requireDb()) return;
          var btn = $("saveBtn"); btn.disabled = true; btn.textContent = "Guardando…";
          hashKey(k1).then(function(hex){
            return db.collection("config").doc("editLock").set({ hash: hex, creada: new Date().toISOString() });
          }).then(function(){
            editHashLoaded = true;
            closeModal();
            setEditing(true);
          }).catch(function(err){
            console.error(err);
            if (err && err.message === "no-subtle-crypto") formError("Este navegador no permite proteger la clave. Abre el tablero en Chrome o Safari actualizado e inténtalo de nuevo.");
            else { writeError(err); btn.disabled = false; btn.textContent = "Crear clave y empezar a editar"; }
          });
        });
        setTimeout(function(){ var f = $("k1"); if (f) f.focus(); }, 50);
      }
      function openUnlockModal(){
        var body = '<form class="form" id="lockForm">'
          + '<p class="form-note">Escribe la clave de edición para desbloquear los cambios en este navegador. Sin la clave, el tablero se sigue viendo en vivo en solo lectura.</p>'
          + '<div><label class="flabel" for="k1">Clave de edición</label><input class="input" id="k1" type="password" autocomplete="current-password" placeholder="Tu clave"></div>'
          + '<div class="form-error" id="formError"></div>'
          + '<div class="form-actions"><button type="submit" class="btn-save" id="saveBtn">Desbloquear edición</button></div></form>';
        openModal("Editar el tablero", body);
        $("lockForm").addEventListener("submit", function(ev){
          ev.preventDefault();
          var k1 = $("k1").value;
          if (!k1) { formError("Escribe tu clave."); return; }
          var btn = $("saveBtn"); btn.disabled = true; btn.textContent = "Comprobando…";
          hashKey(k1).then(function(hex){
            if (hex === editHash) { closeModal(); setEditing(true); }
            else { formError("Clave incorrecta. Inténtalo de nuevo."); btn.disabled = false; btn.textContent = "Desbloquear edición"; }
          }).catch(function(err){
            console.error(err);
            formError("No se pudo comprobar la clave en este navegador. Inténtalo en Chrome o Safari actualizado.");
            btn.disabled = false; btn.textContent = "Desbloquear edición";
          });
        });
        setTimeout(function(){ var f = $("k1"); if (f) f.focus(); }, 50);
      }
      function handleLockButton(){
        if (isEditing) { setEditing(false); return; }
        if (!db) { toast("Todavía no hay conexión con Firestore. Revisa tu internet e inténtalo de nuevo.", true); return; }
        if (!editHashLoaded) { toast("Conectando con Firestore… espera un momento e inténtalo de nuevo.", true); return; }
        if (!editHash) openCreateKeyModal();
        else openUnlockModal();
      }

      function phrasePlanAnchorMonday(){
        var base = parseISO(monday());
        return new Date(base.getFullYear(), base.getMonth() + phrasePlanMonthOffset, 1);
      }
      function openPhraseModal(){
        if (!guardEdit()) return;
        var anchor = phrasePlanAnchorMonday();
        var year = anchor.getFullYear(), monthIdx = anchor.getMonth();
        var mondays = mondaysInMonth(year, monthIdx);
        var monthName = MONTHS[monthIdx] + " " + year;
        var monthCap = monthName.charAt(0).toUpperCase() + monthName.slice(1);
        var viewedMonday = monday();
        var fields = "";
        mondays.forEach(function(mISO, idx){
          var val = phraseForMonday(mISO);
          var isViewed = mISO === viewedMonday;
          fields += '<div><div class="phrase-field-head"><label class="pf-week" for="fp-' + mISO + '">Semana del ' + esc(shortWeekRange(mISO)) + (isViewed ? " · estás viendo esta" : "") + '</label><span class="pf-state' + (val ? " ok" : "") + '">' + (val ? "Fijada" : "Sin fijar") + '</span></div>'
            + '<textarea class="input" id="fp-' + mISO + '" data-phrase-monday="' + mISO + '" placeholder="Frase motivadora de esta semana…" rows="2">' + esc(val) + '</textarea></div>';
        });
        if (!mondays.length) fields = '<p class="form-note">Este mes no tiene lunes para planificar.</p>';
        var fixedCount = weeksFixedCount(mondays);
        var body = '<form class="form" id="phraseForm">'
          + '<div class="phrase-plan-note"><strong>Una sola planificación mensual.</strong> El día 1 se fijan aquí las frases de <strong>todas las semanas del mes</strong>, una distinta por semana, y quedan fijas todo el mes. Solo cambia la Frase de la semana: cada lunes el tablero muestra sola la que toca.</div>'
          + '<div class="phrase-plan-monthnav"><h4>' + esc(monthCap) + '</h4><span class="mn-btns"><button type="button" id="phraseMonthPrev" aria-label="Mes anterior">' + icon("chevL",16) + '</button><button type="button" id="phraseMonthNext" aria-label="Mes siguiente">' + icon("chevR",16) + '</button></span></div>'
          + '<p class="form-note" style="margin-top:-.5rem">' + fixedCount + ' de ' + mondays.length + ' semanas de ' + esc(monthName) + ' ya tienen frase fijada. Las que dejes en blanco quedan pendientes, sin inventar ninguna.</p>'
          + fields
          + '<div class="form-error" id="formError"></div>'
          + '<div class="form-actions"><button type="submit" class="btn-save" id="saveBtn">Guardar frases de ' + esc(monthName) + '</button></div>'
          + '<p class="form-note">Al guardar, todo el mes queda fijo en Firestore y el equipo lo ve al instante. No hace falta tocarlo semana a semana: la siguiente planificación es el día 1 del mes siguiente.</p>'
          + '</form>';
        openModal("Frases del mes — solo Frase de la semana", body);
        $("phraseMonthPrev").addEventListener("click", function(){ phrasePlanMonthOffset--; openPhraseModal(); });
        $("phraseMonthNext").addEventListener("click", function(){ phrasePlanMonthOffset++; openPhraseModal(); });
        $("phraseForm").addEventListener("submit", function(ev){
          ev.preventDefault();
          var updates = {};
          var inputs = document.querySelectorAll("[data-phrase-monday]");
          for (var i=0;i<inputs.length;i++) updates[inputs[i].getAttribute("data-phrase-monday")] = inputs[i].value.trim();
          var btn = $("saveBtn"); btn.disabled = true; btn.textContent = "Guardando el mes…";
          fsSaveMonthPhrases(mondays, updates).then(function(){
            toast("Frases de " + monthName + " fijadas para todo el mes");
            closeModal(); render();
          }).catch(function(err){ writeError(err); btn.disabled = false; btn.textContent = "Guardar frases de " + monthName; });
        });
        setTimeout(function(){ var f = document.querySelector("[data-phrase-monday]"); if (f) f.focus(); }, 50);
      }

      function openActivityModal(a, presetDate){
        if (!guardEdit()) return;
        var isEdit = !!a;
        a = a || { title:"", detail:"", member_id:null, date:presetDate || TODAY, place:"", deliverable:"", status:"pendiente", priority:"ninguna" };
        var body = '<form class="form" id="actForm">'
          + '<div><label class="flabel" for="fTitle">Actividad *</label><input class="input" id="fTitle" type="text" placeholder="Ej.: Visita de campo a tienda" value="' + esc(a.title) + '"></div>'
          + '<div><label class="flabel" for="fDetail">Detalle</label><textarea class="input" id="fDetail" placeholder="Notas, alcance o instrucciones (opcional)">' + esc(a.detail) + '</textarea></div>'
          + '<div class="form-2"><div><label class="flabel" for="fMember">Responsable</label><select class="input" id="fMember">' + memberOptions(a.member_id) + '</select></div>'
          + '<div><label class="flabel" for="fDate">Fecha *</label><input class="input" id="fDate" type="date" value="' + esc(a.date) + '"></div></div>'
          + '<div class="form-2"><div><label class="flabel" for="fPlace">Lugar</label><input class="input" id="fPlace" type="text" placeholder="Ej.: Valco, Santa Elena…" value="' + esc(a.place) + '"></div>'
          + '<div><label class="flabel" for="fDeliv">Entregable</label><input class="input" id="fDeliv" type="text" placeholder="Ej.: Reporte de visita" value="' + esc(a.deliverable) + '"></div></div>'
          + '<div class="form-2"><div><label class="flabel" for="fStatus">Estado</label><select class="input" id="fStatus">' + statusOptions(a.status) + '</select></div>'
          + '<div><label class="flabel" for="fPrio">Prioridad</label><select class="input" id="fPrio">' + priorityOptions(a.priority) + '</select></div></div>'
          + '<div class="form-error" id="formError"></div>'
          + '<div class="form-actions"><button type="submit" class="btn-save" id="saveBtn">' + (isEdit ? "Guardar cambios" : "Agregar actividad") + '</button></div></form>'
          + (isEdit ? deleteBlockHTML() : "");
        openModal(isEdit ? "Editar actividad" : "Nueva actividad", body);
        if (isEdit) bindDelete(function(){ fsDeleteActivity(a.id); });
        $("actForm").addEventListener("submit", function(ev){
          ev.preventDefault();
          var title = $("fTitle").value.trim();
          var date = $("fDate").value;
          if (!title) { formError("Escribe el nombre de la actividad."); return; }
          if (!date) { formError("Elige la fecha de la actividad."); return; }
          var mv = $("fMember").value;
          var data = { title:title, detail:$("fDetail").value.trim(), member_id: mv === "" ? null : Number(mv), date:date, place:$("fPlace").value.trim(), deliverable:$("fDeliv").value.trim(), status:$("fStatus").value, priority:$("fPrio").value };
          var btn = $("saveBtn"); btn.disabled = true; btn.textContent = "Guardando…";
          fsSaveActivity(isEdit ? a.id : null, data).then(function(){ toast(isEdit ? "Actividad actualizada" : "Actividad agregada · visible para todo el equipo"); closeModal(); }).catch(function(err){ writeError(err); btn.disabled = false; btn.textContent = isEdit ? "Guardar cambios" : "Agregar actividad"; });
        });
        setTimeout(function(){ var f = $("fTitle"); if (f) f.focus(); }, 50);
      }

      function openObjectiveModal(o){
        if (!guardEdit()) return;
        var isEdit = !!o;
        o = o || { title:"", detail:"", due_date:"", progress:0, status:"activo" };
        var body = '<form class="form" id="objForm">'
          + '<div><label class="flabel" for="oTitle">Objetivo *</label><input class="input" id="oTitle" type="text" placeholder="Ej.: Completar 12 visitas de campo" value="' + esc(o.title) + '"></div>'
          + '<div><label class="flabel" for="oDetail">Detalle</label><textarea class="input" id="oDetail" placeholder="Cómo se mide o notas (opcional)">' + esc(o.detail) + '</textarea></div>'
          + '<div class="form-2"><div><label class="flabel" for="oDue">Fecha meta</label><input class="input" id="oDue" type="date" value="' + esc(o.due_date || "") + '"></div>'
          + '<div><label class="flabel" for="oStatus">Estado</label><select class="input" id="oStatus">'
          + '<option value="activo"' + (o.status === "activo" ? " selected" : "") + '>Activo</option>'
          + '<option value="pausado"' + (o.status === "pausado" ? " selected" : "") + '>Pausado</option>'
          + '<option value="completado"' + (o.status === "completado" ? " selected" : "") + '>Completado</option></select></div></div>'
          + '<div><label class="flabel" for="oProg">Avance: <span id="oProgVal">' + o.progress + '</span>%</label><input type="range" id="oProg" min="0" max="100" step="5" value="' + o.progress + '"></div>'
          + '<div class="form-error" id="formError"></div>'
          + '<div class="form-actions"><button type="submit" class="btn-save" id="saveBtn">' + (isEdit ? "Guardar cambios" : "Agregar objetivo") + '</button></div></form>'
          + (isEdit ? deleteBlockHTML() : "");
        openModal(isEdit ? "Editar objetivo" : "Nuevo objetivo", body);
        if (isEdit) bindDelete(function(){ fsDeleteObjective(o.id); });
        $("oProg").addEventListener("input", function(){ $("oProgVal").textContent = this.value; });
        $("objForm").addEventListener("submit", function(ev){
          ev.preventDefault();
          var title = $("oTitle").value.trim();
          if (!title) { formError("Escribe el nombre del objetivo."); return; }
          var prog = Number($("oProg").value) || 0;
          var st = $("oStatus").value;
          if (prog >= 100) st = "completado";
          var data = { title:title, detail:$("oDetail").value.trim(), due_date:$("oDue").value || "", progress:prog, status:st };
          var btn = $("saveBtn"); btn.disabled = true; btn.textContent = "Guardando…";
          fsSaveObjective(isEdit ? o.id : null, data).then(function(){ toast(isEdit ? "Objetivo actualizado" : "Objetivo agregado · visible para todo el equipo"); closeModal(); }).catch(function(err){ writeError(err); btn.disabled = false; btn.textContent = isEdit ? "Guardar cambios" : "Agregar objetivo"; });
        });
        setTimeout(function(){ var f = $("oTitle"); if (f) f.focus(); }, 50);
      }

      function openTopicModal(t){
        if (!guardEdit()) return;
        var isEdit = !!t;
        t = t || { title:"", detail:"", pinned:false };
        var pinned = !!t.pinned;
        var body = '<form class="form" id="topicForm">'
          + '<div><label class="flabel" for="tTitle">Tema *</label><input class="input" id="tTitle" type="text" placeholder="Ej.: Revisión del jueves" value="' + esc(t.title) + '"></div>'
          + '<div><label class="flabel" for="tDetail">Detalle</label><textarea class="input" id="tDetail" placeholder="De qué trata, acuerdos o pendientes (opcional)">' + esc(t.detail) + '</textarea></div>'
          + '<div class="toggle-row"><span>Fijar arriba de la lista</span><button type="button" class="toggle-btn' + (pinned ? " on" : "") + '" id="tPin" aria-pressed="' + pinned + '">' + (pinned ? "Fijado" : "No fijado") + '</button></div>'
          + '<div class="form-error" id="formError"></div>'
          + '<div class="form-actions"><button type="submit" class="btn-save" id="saveBtn">' + (isEdit ? "Guardar cambios" : "Agregar tema") + '</button></div></form>'
          + (isEdit ? deleteBlockHTML() : "");
        openModal(isEdit ? "Editar tema" : "Nuevo tema", body);
        if (isEdit) bindDelete(function(){ fsDeleteTopic(t.id); });
        $("tPin").addEventListener("click", function(){
          pinned = !pinned;
          this.classList.toggle("on", pinned);
          this.setAttribute("aria-pressed", pinned);
          this.textContent = pinned ? "Fijado" : "No fijado";
        });
        $("topicForm").addEventListener("submit", function(ev){
          ev.preventDefault();
          var title = $("tTitle").value.trim();
          if (!title) { formError("Escribe el título del tema."); return; }
          var data = { title:title, detail:$("tDetail").value.trim(), pinned:pinned };
          var btn = $("saveBtn"); btn.disabled = true; btn.textContent = "Guardando…";
          fsSaveTopic(isEdit ? t.id : null, data).then(function(){ toast(isEdit ? "Tema actualizado" : "Tema agregado · visible para todo el equipo"); closeModal(); }).catch(function(err){ writeError(err); btn.disabled = false; btn.textContent = isEdit ? "Guardar cambios" : "Agregar tema"; });
        });
        setTimeout(function(){ var f = $("tTitle"); if (f) f.focus(); }, 50);
      }

      /* ---------- render root ---------- */
      function render(){
        renderHeader();
        renderPhrase();
        renderTabs();
        document.querySelectorAll(".stat .lbl").forEach(function(el){
          var name = el.getAttribute("data-ic");
          if (name && !el.querySelector("svg")) el.insertAdjacentHTML("afterbegin", icon(name, 11));
        });
        var main = document.getElementById("main");
        if (view === "semana") renderSemana(main);
        else if (view === "agenda") renderAgenda(main);
        else if (view === "objetivos") renderObjetivos(main);
        else if (view === "temas") renderTemas(main);
        else if (view === "equipo") renderEquipo(main);
      }
      document.getElementById("weekPrev").innerHTML = icon("chevL",18);
      document.getElementById("weekNext").innerHTML = icon("chevR",18);
      document.getElementById("weekPrev").addEventListener("click", function(){ weekOffset--; render(); });
      document.getElementById("weekNext").addEventListener("click", function(){ weekOffset++; render(); });
      document.getElementById("weekToday").addEventListener("click", function(){ weekOffset = 0; render(); });
      document.getElementById("fab").addEventListener("click", function(){
        if (view === "objetivos") openObjectiveModal(null);
        else if (view === "temas") openTopicModal(null);
        else if (view === "agenda") openActivityModal(null, selectedDay);
        else openActivityModal(null, monday());
      });
      document.addEventListener("keydown", function(e){ if (e.key === "Escape") closeModal(); });
      var lockBtn = document.getElementById("editLockBtn");
      if (lockBtn) lockBtn.addEventListener("click", handleLockButton);
      updateLockUI();
      render();
      initFirebase();
    </script>
  </body>
</html>
